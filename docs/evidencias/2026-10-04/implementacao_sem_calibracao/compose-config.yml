name: fatigue_20260601
services:
  salte-fatigue:
    build:
      context: /home/bruno/Documents/TRABALHO/SALTE_DROWSINESS/FATIGUE_20260601
      dockerfile: Dockerfile
    command:
      - python3
      - run_host.py
      - --camera-id-contains
      - "70000"
      - --no-danger-record
      - --logs-dir
      - /app/logs
      - --log-frame-every
      - "5"
      - --log-assessment-every
      - "5"
      - --danger-output-dir
      - /app/logs/incidents
    container_name: salte-fatigue
    device_cgroup_rules:
      - c *:* rmw
    environment:
      PYTHONUNBUFFERED: "1"
    image: salte-fatigue:latest
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      default: null
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    volumes:
      - type: bind
        source: /dev
        target: /dev
        bind:
          create_host_path: true
      - type: bind
        source: /run/udev
        target: /run/udev
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: /home/bruno/Documents/TRABALHO/SALTE_DROWSINESS/FATIGUE_20260601/logs
        target: /app/logs
        bind:
          create_host_path: true
      - type: bind
        source: /home/bruno/Documents/TRABALHO/SALTE_DROWSINESS/FATIGUE_20260601/config
        target: /app/config
        bind:
          create_host_path: true
networks:
  default:
    name: fatigue_20260601_default
